<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        async function findTown() {
            const search = document.querySelector('#search').value.toLowerCase();
            const response = await fetch('https://oim.108122.xyz/mass');
            const data = await response.json();

  const matches = [];
  for (const town of data.data) {
    if (town.name.toLowerCase().includes(search)) {
      matches.push(town);
    }
  }

  if (matches.length === 0) {
    result.innerHTML = '<p>No matches found.</p>';
  } else {
    for (const town of matches) {
      result.innerHTML += `<p>${town.name}: pop ${town.population}</p>`;
    }
  }

  document.querySelector('#search').addEventListener('input', () => {
    result.innerHTML = '';
  });


  displayResults(matches);
} 
function displayResults(matches) {
  const result = document.querySelector('#result');
  result.innerHTML = ''; // Clear previous results

  if (matches.length === 0) {
    result.innerHTML = '<p>No matches found.</p>';
    return;
  }

  for (const town of matches) {
    result.innerHTML += `<p>${town.name}: pop ${town.population}</p>`;
  }
}
    </script>

    <input type="text" id="search" placeholder="Search for a town...">
    <button onclick="findTown()">Search</button>
    <div id="result"></div>
</body>
</html>
